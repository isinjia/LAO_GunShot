<!doctype html><meta charset="utf-8"><style>body{margin:0;background:#111;color:white}iframe{width:100vw;height:calc(100vh - 38px);border:0}nav{height:38px}</style><nav><button onclick="runTests()">회귀 검사</button><button onclick="preview('lrl')">LRL 빔</button><button onclick="preview('ramp')">램파리온 돌진</button><button onclick="pauseView()">ESC 정보</button><button onclick="laserView()">흰색 레이저</button><button onclick="preview('glow')">램파리온 발광</button><button onclick="noReloadCheck()">LRL 장전 없음</button><b id="status">로딩</b></nav><iframe src="../../index.html?sim=1&god=1&tut=0&speed=0&mute=1"></iframe><script>
let w;const status=document.querySelector('#status');let ready=false;
const timer=setInterval(()=>{w=document.querySelector('iframe').contentWindow;if(w.GAME&&w.GAME.G.phase==='title'){clearInterval(timer);ready=true;status.textContent='준비 완료'}},300);
function key(code,on){w.dispatchEvent(new w.KeyboardEvent(on?'keydown':'keyup',{code,key:code, bubbles:true}));}
function sim(sec){w.GAME.G.paused=false;w.GAME.debug.sim(sec,1/60);}
function assert(v,msg){if(!v)throw Error(msg)}
async function begin(id){await w.GAME.startRun(w.DATA.HEROES.length+w.DATA.HIDDEN.findIndex(h=>h.id===id));const P=w.GAME.G.P;P.aim=0;P.face=1;return P}
function target(x,y){const e=w.GAME.debug.spawnEnemy('legion',x,y);e.spawnT=0;e.hp=e.maxHp=5000;e.stun=100;e.room=null;return e}
async function runTests(){try{
const results=[];let P=await begin('ramparion'),G=w.GAME.G;const body=P.body,shape=Array.from(body.c.S),pose=Array.from(body.c.T),home=[P.x,P.y];
for(const a of [0,Math.PI/2,Math.PI]){P.aim=a;P.skill=100;w.INPUT.push('skill');sim(1/60);assert(P.hh.castBody!==body,'궁극기 리그 미분리');sim(5.4);assert(!P.hh&&P.body===body&&body.root.visible,'궁극기 복구');const ref=w.SD.create('AGS_Rampart_NS1');ref.time=body.c.time;ref.reset();ref.apply();ref.render();assert(Array.from(ref.S).every((v,i)=>Math.abs(v-body.c.S[i])<.001),'기본 본 스케일 오염');ref.dispose();assert(Math.hypot(P.x-home[0],P.y-home[1])<.001,'귀환');}
results.push('램파리온 3방향 본/위치 복구 PASS');
P.aim=0;P.sk2Cd=0;key('KeyE',true);sim(1/60);key('KeyD',true);const x=P.x;sim(.2);key('KeyD',false);const chargedMove=P.x-x;assert(P.lionHolding&&P.lionCharge>0,'E 홀드');assert(Math.abs(chargedMove/P.hero.speed/.2-.5)<.08,'충전 이속 50%');assert(P.sk2Cd===0,'충전 중 쿨타임');sim(2);assert(P.lionCharge===2&&P.lionHolding,'최대 충전 유지');key('KeyE',false);sim(1/60);assert(!P.lionHolding&&P.lionPower===1&&P.sk2Cd>0,'충전 발사');results.push('E 최대충전/이속50%/릴리즈 PASS');
const g=P.guns[P.gi];assert(g.d.kind==='rail'&&g.d.range===7&&g.d.color===0xffffff,'흰색 중거리 레이저');results.push('기본 레이저 설정 PASS');
P=await begin('lrl');G=w.GAME.G;let tickers=w.FX.tickers.length;P.sk2Cd=0;w.INPUT.push('skill2');sim(1/60);assert(w.FX.tickers.length-tickers===3,'검기 개수');assert(P.guns[P.gi].hand.outer.visible,'E 도끼 사라짐');w.INPUT.mouse.down=true;sim(.2);w.INPUT.mouse.down=false;assert(P.guns[P.gi].hand.outer.visible,'사격 도끼 사라짐');results.push('LRL E 검기3/손·도끼 유지 PASS');
P.skill=100;P.aim=0;const e=target(P.x+2,P.y);w.INPUT.push('skill');sim(1/60);assert(P.lrlCast,'LRL 궁극기 시작');sim(.85);assert(P.lrlCast.run.t>=.75&&P.lrlCast.run.t<1.75,'눈빛 충전');sim(2.4);assert(!P.lrlCast&&P.body.root.visible,'LRL 궁극기 종료');assert(e.hp<5000&&e.blindT>0,'LRL 빔 타격/실명');results.push('LRL 원본 궁극기/실명/복구 PASS');
P.up.u_beam=2;P.up.u_axe=1;w.UI.togglePause(true);const info=w.document.querySelector('#pauseInfo').innerText;assert(info.includes(P.hero.sk2.name)&&info.includes(P.hero.skillName)&&info.includes('봉인 해제 Lv.2'),'ESC 스킬 정보');results.push('ESC E/F 설명/강화 정보 PASS');assert(!G.errors,'런타임 오류');status.textContent='PASS '+results.join(' | ');
}catch(e){status.textContent='FAIL '+e.stack;}}
async function preview(which){try{let P=await begin(which==='lrl'?'lrl':'ramparion');P.aim=0;P.skill=100;w.INPUT.push('skill');sim(1/60);sim(which==='lrl'?1.7:which==='glow'?3.45:3.95);w.GAME.G.paused=true;status.textContent=which+' 프리뷰 errors='+(w.GAME.G.errors||0);}catch(e){status.textContent=e.stack}}
async function pauseView(){const P=await begin('lrl');P.up.u_beam=2;P.up.u_axe=1;w.UI.togglePause(true);status.textContent='ESC 스킬 정보'}

async function laserView(){try{const P=await begin('ramparion');sim(1/60);P.aim=0;P.face=1;sim(1/60);const [mx,my]=P.muzzle;const near=target(mx+2,my),far=target(mx+9,my);near.y=my-near.h*.42;far.y=my-far.h*.42;P.fireCd=0;w.INPUT.mouse.down=true;sim(1/60);w.INPUT.mouse.down=false;assert(near.hp<5000&&far.hp===5000,'레이저 사거리 판정');w.GAME.G.paused=true;status.textContent='레이저 타격 PASS near='+near.hp+' far='+far.hp+' errors='+(w.GAME.G.errors||0);}catch(e){status.textContent='FAIL '+e.stack}}

async function noReloadCheck(){try{const P=await begin('lrl'),G=w.GAME.G,g=P.guns[P.gi],shots=G.stats.shots,mag=g.mag;w.INPUT.mouse.down=true;for(let i=0;i<32;i++){if(i===16)w.INPUT.push('reload');sim(.25);assert(P.reloadT===0,'도끼 장전 발생');}w.INPUT.mouse.down=false;assert(g.mag===mag&&G.stats.shots-shots>=17,'도끼 연속 공격 중단');assert(w.document.querySelector('#gunBox').classList.contains('no-reload'),'장전 없음 HUD');G.paused=true;status.textContent='PASS LRL 8초 연속 공격 '+(G.stats.shots-shots)+'회 · 자동/수동 장전 없음 · errors='+(G.errors||0);}catch(e){status.textContent='FAIL '+e.stack}}
</script>
