<!doctype html><meta charset="utf-8"><style>body{margin:0;color:white;background:#111}iframe{width:100vw;height:90vh;border:0}</style><button onclick="touchCheck()">터치 검사</button><button onclick="voiceCheck()">음성 검사</button><b id="status">로딩</b><iframe src="../../index.html?touch=1&sim=1&speed=0"></iframe><script>
let w;const status=document.querySelector('#status');const clock=setInterval(()=>{w=document.querySelector('iframe').contentWindow;if(w.GAME&&w.GAME.G.phase==='title'){clearInterval(clock);status.textContent='준비 완료'}},300);function check(v,m){if(!v)throw Error(m)}
function touchCheck(){try{const cards=w.document.querySelectorAll('.hcard');const base=w.UI.sel===2?1:2;cards[base+1].click();for(const idx of [base,base+1,base,base+1,base,base+1,base,base+1])cards[idx].click();check(w.UI.sel===-1&&cards[0].textContent.includes('LRL')&&w.GAME.G.phase==='title','카드 터치 실패');cards[3].click();const root=w.document.querySelector('#heroSel');for(const dir of [-1,1,-1,1,-1,1,-1,1]){root.dispatchEvent(new w.PointerEvent('pointerdown',{pointerId:42,pointerType:'touch',isPrimary:true,clientX:100,clientY:100,bubbles:true}));root.dispatchEvent(new w.PointerEvent('pointerup',{pointerId:42,pointerType:'touch',isPrimary:true,clientX:100+dir*60,clientY:100,bubbles:true,cancelable:true}));}check(w.UI.sel===-1&&cards[0].classList.contains('on')&&w.GAME.G.phase==='title','스와이프 실패');check(!w.document.body.innerText.includes('FAN'),'FAN 문구 잔존');status.textContent='PASS 카드 좌우 터치·스와이프 LRL 자동 선택 · 출격 오작동 없음 · 브랜드 문구 확인';}catch(e){status.textContent='FAIL '+e.stack}}
async function voiceCheck(){try{w.SFX.unlock();await w.SFX.debug.ctx.resume();w.SFX.setVolume('voice',1);w.SFX.setMuted(false);const c=w.SFX.debug.ctx;let count=0;for(const hero of ['lrl','ramparion'])for(const suffix of ['SortiePick','StageStart','SpSkill','Retreat','MVP','Retire','BattleFocus',hero==='lrl'?'ActionApprove':'SpSkill_3']){const r=await fetch('../../assets/voice/'+hero+'/'+suffix+'.mp3');check(r.ok,'음성 파일 누락');const b=await c.decodeAudioData(await r.arrayBuffer());check(b.duration>0.1,'빈 음성');count++;}for(const hero of ['lrl','ramparion']){const old=w.SFX.debug.voice;w.SFX.voice(hero,'SpSkill',1,true);for(let i=0;i<20&&w.SFX.debug.voice===old;i++)await new Promise(r=>setTimeout(r,50));check(w.SFX.debug.voice&&w.SFX.debug.voice!==old,'재생 실패 '+hero);}status.textContent='PASS '+count+'개 원본 음성 디코딩 · LRL/램파리온 실제 음성 소스 재생';}catch(e){status.textContent='FAIL '+e.stack}}
</script>
