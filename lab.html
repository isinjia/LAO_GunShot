<!doctype html>
<html><head><meta charset="utf-8"><title>SD hand lab</title>
<style>body{margin:0;background:#222;color:#ddd;font:12px monospace}#c{display:block}#log{position:fixed;left:4px;top:4px;white-space:pre;max-height:98vh;overflow:auto;pointer-events:none}</style>
</head><body><canvas id="c"></canvas><div id="log"></div>
<script src="js/vendor/three.min.js"></script>
<script src="js/sd.js"></script>
<script src="js/rigs.js"></script>
<script>
// lab.html?ids=brownie,gnome  — per id: full rig | rig with arms hidden | floating hand+weapon
const q = new URLSearchParams(location.search);
const ids = (q.get('ids') || 'brownie').split(',');
const W = innerWidth, H = innerHeight;
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
r.setSize(W, H); r.setClearColor(0x333840);
SD.gpuSkin = r.capabilities.floatVertexTextures; SD.texScale = 0.5; SD.renderer = r;
const scene = new THREE.Scene();
const cam = new THREE.OrthographicCamera(0, W / 100, H / 100, 0, -10, 10);
const log = (s) => { document.getElementById('log').textContent += s + '\n'; };
const chars = [];
(async () => {
  let row = 0;
  for (const id of ids) {
    await SD.prepare(id);
    const t = SD.template(id);
    const cols = Math.max(1, Math.floor(W / 100 / 4.6)); const cx = (row % cols) * 4.6, y0 = H / 100 - 2.2 - Math.floor(row / cols) * 2.6;
    const spec = RIGS[id] || {};
    const k = 1.3 / t.height;
    const full = SD.create(id); full.root.scale.set(k, k, 1); full.root.position.set(cx + 0.7, y0 - t.box.min.y * k, 0); scene.add(full.root);
    const body = SD.create(id); body.root.scale.set(k, k, 1); body.root.position.set(cx + 1.9, y0 - t.box.min.y * k, 0); scene.add(body.root);
    if (spec.hide) body.setMask((p, n) => spec.hide.test(n));
    const hp = RIGS.makeHand(id, k);
    if (hp) { hp.group.position.set(cx + 2.8, y0 + 0.8, 0); scene.add(hp.group); }
    const hp2 = RIGS.makeHand(id, k);
    if (hp2) { hp2.group.position.set(cx + 3.9, y0 + 0.8, 0); hp2.group.rotation.z = Math.PI * 0.75; hp2.group.scale.y = -1; scene.add(hp2.group); }
    const mk = (x, c) => { const m = new THREE.Mesh(new THREE.CircleGeometry(0.04, 8), new THREE.MeshBasicMaterial({ color: c })); m.position.set(x, y0 + 0.8, 1); m.renderOrder = 99; scene.add(m); };
    mk(cx + 2.8, 0xff0000); mk(cx + 3.9, 0xff0000);
    const lb = document.createElement('div'); lb.textContent = id; lb.style.cssText = 'position:fixed;color:#fc0;left:' + (cx * 100 + 10) + 'px;top:' + ((H / 100 - y0 - 1.0) * 100) + 'px'; document.body.appendChild(lb);
    chars.push({ id, full, body, k });
    log(id + ' h=' + t.height.toFixed(2) + (hp ? ' muzzle=' + hp.muzzle.map((v) => v.toFixed(2)) : ' (no hand spec)'));
    row++;
  }
  window.LAB = { chars, scene };
  const loop = () => { chars.forEach((c) => { c.full.update(1 / 60); c.body.update(1 / 60); }); r.render(scene, cam); requestAnimationFrame(loop); };
  loop();
})();
</script></body></html>
